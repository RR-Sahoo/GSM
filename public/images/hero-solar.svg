<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="800" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="60%" stop-color="#102C4E"/>
      <stop offset="100%" stop-color="#0D3B3E"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#173D6E"/>
      <stop offset="100%" stop-color="#0A1E36"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="540" rx="24" fill="url(#sky)"/>
  <circle cx="640" cy="115" r="170" fill="url(#sun)"/>
  <circle cx="640" cy="115" r="42" fill="#10B981" fill-opacity="0.25" stroke="#34D399" stroke-width="2"/>
