      <line x1="105" y1="0" x2="105" y2="145"/>
      <line x1="158" y1="0" x2="158" y2="145"/>
      <line x1="0" y1="36" x2="210" y2="36"/>
      <line x1="0" y1="72" x2="210" y2="72"/>
      <line x1="0" y1="108" x2="210" y2="108"/>
    </g>
  </g>
  <rect x="145" y="395" width="8" height="28" fill="#64748B"/>
  <rect x="265" y="395" width="8" height="28" fill="#64748B"/>

  <!-- Solar Array 2 -->
  <g transform="translate(360, 225) skewX(-18)">
    <rect x="0" y="0" width="235" height="165" rx="6" fill="url(#panel)" stroke="#34D399" stroke-width="2.5"/>
    <g stroke="#34D399" stroke-opacity="0.35" stroke-width="1.2">
      <line x1="58" y1="0" x2="58" y2="165"/>
      <line x1="117" y1="0" x2="117" y2="165"/>
      <line x1="176" y1="0" x2="176" y2="165"/>
      <line x1="0" y1="41" x2="235" y2="41"/>
