  <rect x="70" y="422" width="660" height="10" rx="4" fill="#1E3A5F"/>

  <!-- Solar Array 1 -->
  <g transform="translate(115, 250) skewX(-18)">
    <rect x="0" y="0" width="210" height="145" rx="6" fill="url(#panel)" stroke="#38BDF8" stroke-width="2.5"/>
    <g stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2">
