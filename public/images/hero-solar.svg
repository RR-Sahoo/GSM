  <!-- Energy Flow Card -->
  <g transform="translate(55, 55)">
    <rect width="260" height="84" rx="14" fill="#0F294A" fill-opacity="0.92" stroke="#1E4B7A"/>
    <circle cx="36" cy="42" r="16" fill="#10B981" fill-opacity="0.2"/>
    <path d="M38 30 L28 44 H36 L34 54 L44 40 H36 Z" fill="#34D399"/>
    <text x="66" y="36" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Solar &amp; Power Solutions</text>
    <text x="66" y="57" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Up to 1 MW Project Capability</text>
